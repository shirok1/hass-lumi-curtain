[project]
name = "hass-lumi-curtain"
version = "0.1.4"
description = "Local BLE control of lumi.curtain.hmcn02 for Home Assistant"
requires-python = ">=3.14.2,<3.15"
dependencies = [
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.0",
    "cryptography>=46",
]

[dependency-groups]
dev = [
  "homeassistant-stubs==2026.9.1",
  "pytest-homeassistant-custom-component==0.13.364",
  "pytest-cov>=7",
  "ruff>=0.15",
  "ty>=0.0.1",
  "aiousbwatcher==1.1.2",
  "serialx==1.10.0",
  "habluetooth==6.26.11",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components.lumi_curtain --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["custom_components", "tests"]
